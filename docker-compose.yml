services:
  postgres:
    image: postgres:17-alpine
    container_name: canada-deals-postgres
    environment:
      POSTGRES_DB: canadadeals
      POSTGRES_USER: canadadeals
      POSTGRES_PASSWORD: canadadeals
    ports:
      - "5432:5432"
    volumes:
      - canada-deals-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canadadeals -d canadadeals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  canada-deals-postgres-data:
